name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the previous run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # next-env.d.ts is gitignored but listed in tsconfig include, and it is
      # what declares the module types for static image imports. On a clean
      # checkout it does not exist yet, so tsc fails on every `import logo from
      # "@/public/*.png"`. typegen writes it without a full build.
      - name: Generate Next types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Test
        run: npm test

      # Catches what typecheck and unit tests cannot: the build pipeline
      # silently dropping something. A stripped @import is exactly how the
      # webfonts stopped loading without anyone noticing.
      - name: Build
        run: npm run build

  cms:
    name: Studio
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cms/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      # Compiles the schema. A broken schema would otherwise only surface
      # during `sanity deploy`, after the website has already shipped.
      - name: Build
        run: npm run build
